name: Release

# Builds the app on Windows, macOS, and Linux and attaches BOTH the raw
# PyInstaller output and a proper double-click installer for each OS
# (see packaging/README.md) to a GitHub Release whenever a version tag
# (e.g. v0.1.0) is pushed. The installers are what register the .emfm
# file association; the raw binaries remain for anyone who just wants a
# portable executable with no OS integration.

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset_name: ESP32MultiFlashManager-windows.exe
            dist_path: dist/ESP32MultiFlashManager.exe
          - os: macos-latest
            asset_name: ESP32MultiFlashManager-macos.zip
            dist_path: dist/ESP32MultiFlashManager.app
          - os: ubuntu-latest
            asset_name: ESP32MultiFlashManager-linux
            dist_path: dist/ESP32MultiFlashManager

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Derive version from tag
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Install Linux serial/Qt runtime + AppImage icon dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libdbus-1-3 librsvg2-bin libfuse2

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Install Inno Setup
        if: runner.os == 'Windows'
        run: choco install innosetup -y

      # --- Raw PyInstaller build (unchanged asset, kept for portability) ---

      - name: Build with PyInstaller (Windows)
        if: runner.os == 'Windows'
        run: >
          pyinstaller --noconfirm --windowed --onefile
          --name ESP32MultiFlashManager
          --icon resources/icons/app_icon.ico
          --add-data "resources;resources"
          --collect-all esptool
          --collect-all espsecure
          --collect-all espefuse
          run.py

      - name: Build with PyInstaller (macOS)
        if: runner.os == 'macOS'
        run: >
          pyinstaller --noconfirm --windowed --onefile
          --name ESP32MultiFlashManager
          --add-data "resources:resources"
          --collect-all esptool
          --collect-all espsecure
          --collect-all espefuse
          run.py

      - name: Build with PyInstaller (Linux)
        if: runner.os == 'Linux'
        run: >
          pyinstaller --noconfirm --onefile
          --name ESP32MultiFlashManager
          --add-data "resources:resources"
          --collect-all esptool
          --collect-all espsecure
          --collect-all espefuse
          run.py

      - name: Zip macOS .app
        if: runner.os == 'macOS'
        run: cd dist && zip -r ../${{ matrix.asset_name }} ESP32MultiFlashManager.app

      - name: Rename Windows/Linux output to asset name
        if: runner.os != 'macOS'
        shell: bash
        run: cp "${{ matrix.dist_path }}" "${{ matrix.asset_name }}"

      # --- Installers (packaging/, registers the .emfm association) ---
      # Each script rebuilds the app itself via its OS-appropriate PyInstaller
      # invocation (the Windows one reuses the exe just built above instead;
      # macOS/Linux use their own spec/flags to bundle the doc-type/MIME
      # association, so they build fresh rather than reusing the exe above).

      - name: Build installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/windows/build_installer.ps1 -Version "${{ steps.version.outputs.version }}" -SkipPyInstaller

      - name: Build installer (macOS)
        if: runner.os == 'macOS'
        run: bash packaging/macos/build_dmg.sh "${{ steps.version.outputs.version }}"

      - name: Build installer (Linux)
        if: runner.os == 'Linux'
        run: bash packaging/linux/build_appimage.sh "${{ steps.version.outputs.version }}"

      - name: Upload raw build asset to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer asset to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/installer/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
